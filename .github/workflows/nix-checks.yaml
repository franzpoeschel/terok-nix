name: Nix Checks
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  nix-checks-ubuntu:
    name: Run Nix checks on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-26.05
      - run: nix flake check --verbose
